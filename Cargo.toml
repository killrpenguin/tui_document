[package]
name = "tui_document"
version = "0.9.0"
authors = ["David McFarland <dmcfarland8031@gmail.com>"]
description = "A Ratatui widget wrapping the Ropey crate."
documentation = "https://docs.rs/tui_document"
repository = "https://github.com/killrpenguin/tui_document"
categories = ["text-editors", "text-processing"]
keywords = ["tui", "editor", "input", "ratatui", "text-processing", "data-structures"]
edition = "2024"

[dependencies]
ropey = "1.6.1"
ratatui = { version = "*", features = ["serde", "macros"] }

[dev-dependencies]
insta = "1.43.1"
